<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Categorias do Bolsonarismo</title>
<meta name="description" content="Diagrama de Venn interativo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f1eee6;
  --paper-2:#e7e3d8;
  --field:#faf8f3;
  --ink:#1c1b18;
  --ink-2:#5a574e;
  --rule:#cbc6b8;
  --a:#e2ad45;
  --b:#d4613f;
  --c:#5f84ad;
  --d:#bdb7aa;
  --serif:'Instrument Serif', Georgia, 'Times New Roman', serif;
  --sans:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1320px;margin:0 auto;padding:0 28px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}

/* Cabeçalho */
header.top{
  display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
  padding:34px 0 20px;border-bottom:1px solid var(--ink);
}
h1{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(46px,7.4vw,104px);line-height:.92;letter-spacing:-.015em;margin:0;
  overflow-wrap:anywhere;
}
h1 em{font-style:italic}
.meta{display:flex;flex-wrap:wrap;gap:6px 22px;padding-bottom:8px}

/* Grade principal */
main.grid{
  display:grid;grid-template-columns:minmax(0,1fr) 390px;
  border-bottom:1px solid var(--ink);
}
.stage{position:relative;padding:22px 30px 26px 0;border-right:1px solid var(--ink)}
.panel{
  padding:24px 0 30px 30px;
  position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;
}

/* Diagrama */
svg.venn{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
svg.venn *{pointer-events:none}
.circ{mix-blend-mode:multiply;fill-opacity:.62}
.circ.a{fill:var(--a)} .circ.b{fill:var(--b)} .circ.c{fill:var(--c)}
.circ.d{fill:var(--d);fill-opacity:.45}
.reg circle{fill:transparent;transition:fill .12s ease}
.reg.hover circle{fill:rgba(28,27,24,.09)}
.reg.sel circle{fill:url(#hatch)}
.ol{fill:none;stroke:var(--ink);stroke-width:1.3}
.ol.dash{stroke-dasharray:3 6;stroke-linecap:round;stroke-width:1.5}
.lbl-code{font-family:var(--mono);font-size:13px;letter-spacing:.1em;fill:var(--ink-2)}
.lbl-name{font-family:var(--serif);fill:var(--ink)}
.tile-rect{fill:none;stroke:var(--ink);stroke-width:1}
.tile-bg{fill:var(--field);stroke:var(--ink);stroke-width:1}
.tile-more{fill:var(--ink)}
.tile-q{font-family:var(--serif);fill:var(--ink)}
.tile-n{font-family:var(--mono);font-size:11px;fill:var(--paper)}

.tip{
  position:absolute;left:0;top:0;pointer-events:none;
  background:var(--ink);color:var(--paper);
  font-family:var(--mono);font-size:11px;letter-spacing:.04em;
  padding:5px 8px;white-space:nowrap;opacity:0;transform:translate(12px,14px);
  transition:opacity .1s;
}
.tip.on{opacity:1}

/* Índice */
.index-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;padding-bottom:10px}
.index{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--ink)}
.idx{
  appearance:none;background:none;border:0;border-bottom:1px solid var(--rule);
  text-align:left;padding:10px 12px 12px 0;font:inherit;color:inherit;cursor:pointer;
  display:flex;flex-direction:column;gap:3px;min-width:0;
}
.idx .code{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.idx .nm{font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.idx:hover .nm{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.idx.on{border-bottom:2px solid var(--ink);padding-bottom:11px}
.idx.on .nm{font-weight:600}
.idx:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* Painel */
.panel h2{font-family:var(--serif);font-weight:400;font-size:38px;line-height:1.02;margin:8px 0 0;letter-spacing:-.005em;overflow-wrap:anywhere}
.panel p{margin:0}
.lede{font-size:16px;color:var(--ink-2);margin-top:12px !important;max-width:34ch}
.muted{color:var(--ink-2)}
.small{font-size:13px;line-height:1.45}

.toolbar{border:1px solid var(--ink);padding:12px 14px;margin-bottom:24px;background:var(--field)}
.toolbar .row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}

.labels{border-top:1px solid var(--rule);margin-top:12px;padding-top:10px}
.labels summary{cursor:pointer;list-style:none;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.labels summary::-webkit-details-marker{display:none}
.labels summary::before{content:'+';display:inline-block;width:16px}
.labels[open] summary::before{content:'\2013'}
.fld{margin-top:10px}
.fld label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:4px}
.fld input{padding:6px 8px;font-size:13.5px}
.fld .hint{font-size:12px;color:var(--ink-2);margin-top:4px}
.labels .sub{margin-top:16px;padding-top:10px;border-top:1px dashed var(--rule)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}

.btn{
  appearance:none;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;
  background:transparent;color:var(--ink);border:1px solid var(--ink);
  padding:7px 11px;cursor:pointer;line-height:1.2;border-radius:0;
}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.solid:hover{background:transparent;color:var(--ink)}
.btn.quiet{border-color:transparent;padding-left:0;padding-right:0;text-decoration:underline;text-underline-offset:3px}
.btn.quiet:hover{background:none;color:var(--b)}
.btn[disabled]{opacity:.5;cursor:progress}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

input[type=text],input[type=url],textarea,select{
  font:inherit;font-size:14px;color:var(--ink);background:var(--field);
  border:1px solid var(--rule);border-radius:0;padding:8px 10px;width:100%;
}
.toolbar input[type=text]{background:#fff}
textarea{resize:vertical;min-height:84px;line-height:1.45}
select{width:auto;padding:5px 8px;font-size:12.5px;max-width:100%}

.add{border:1px dashed var(--ink-2);padding:14px;margin-top:20px;transition:background .12s}
.add.drag{background:var(--paper-2);border-style:solid}
.add .row{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
.add .sep{border-top:1px solid var(--rule);margin:14px 0 12px}
.add .row input{flex:1 1 160px;width:auto}

.items{display:grid;gap:22px;margin-top:24px}
.item img{display:block;width:100%;height:auto;border:1px solid var(--ink);cursor:zoom-in;background:var(--paper-2)}
.item .cap{font-size:13px;color:var(--ink-2);margin-top:7px}
.item.text .body{font-size:16.5px;line-height:1.5;white-space:pre-wrap;border-left:2px solid var(--ink);padding:2px 0 2px 14px}
.item .cap-in{margin-top:7px;font-size:13px;padding:6px 8px}
.item .tools{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.item .tools .mono{font-size:10.5px}
.empty{margin-top:22px;padding:18px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}

/* Rodapé */
footer.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0 40px;flex-wrap:wrap}

/* Visualizador de imagem */
.lb{
  position:fixed;inset:0;z-index:20;background:rgba(28,27,24,.94);
  display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px;cursor:zoom-out;
}
.lb.on{display:flex}
.lb img{max-width:min(1200px,94vw);max-height:80vh;display:block;border:1px solid #000}
.lb p{color:var(--paper);font-size:14px;margin:14px 0 0;max-width:70ch;text-align:center}
.lb .mono{color:#a8a397;position:absolute;top:18px;right:24px}

.toast{
  position:fixed;left:24px;bottom:24px;z-index:30;background:var(--ink);color:var(--paper);
  font-family:var(--mono);font-size:12px;padding:10px 14px;max-width:calc(100vw - 48px);
  opacity:0;transform:translateY(8px);transition:opacity .18s,transform .18s;pointer-events:none;
}
.toast.on{opacity:1;transform:none}

.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:960px){
  main.grid{grid-template-columns:1fr}
  .stage{border-right:0;border-bottom:1px solid var(--ink);padding-right:0}
  .panel{position:static;max-height:none;overflow:visible;padding-left:0}
}
@media (max-width:620px){
  .wrap{padding:0 16px}
  .index{grid-template-columns:repeat(2,minmax(0,1fr))}
  .panel h2{font-size:32px}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1 id="title">Categorias do <em>Bolsonarismo</em></h1>
    <div class="meta mono">
      <span>Diagrama de Venn</span>
      <span id="m-count">0 itens</span>
      <span id="m-date"></span>
    </div>
  </header>

  <main class="grid">
    <section class="stage" id="stage">
      <svg class="venn" id="venn" viewBox="30 40 1060 775" role="img" aria-labelledby="venn-t">
        <title id="venn-t">Diagrama de Venn</title>
        <defs>
          <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="7" height="7" fill="rgba(28,27,24,.05)"/>
            <line x1="0" y1="0" x2="0" y2="7" stroke="#1c1b18" stroke-width="1.4" stroke-opacity=".5"/>
          </pattern>
          <clipPath id="cB"><circle cx="620" cy="310" r="210"/></clipPath>
          <clipPath id="cC"><circle cx="510" cy="500" r="210"/></clipPath>
          <mask id="mA" maskUnits="userSpaceOnUse" x="0" y="0" width="1100" height="820"><rect width="1100" height="820" fill="#fff"/><circle cx="400" cy="310" r="210" fill="#000"/></mask>
          <mask id="mB" maskUnits="userSpaceOnUse" x="0" y="0" width="1100" height="820"><rect width="1100" height="820" fill="#fff"/><circle cx="620" cy="310" r="210" fill="#000"/></mask>
          <mask id="mC" maskUnits="userSpaceOnUse" x="0" y="0" width="1100" height="820"><rect width="1100" height="820" fill="#fff"/><circle cx="510" cy="500" r="210" fill="#000"/></mask>
        </defs>

        <g>
          <circle class="circ a" cx="400" cy="310" r="210"/>
          <circle class="circ b" cx="620" cy="310" r="210"/>
          <circle class="circ c" cx="510" cy="500" r="210"/>
          <circle class="circ d" cx="950" cy="640" r="110"/>
        </g>

        <g id="regs">
          <g class="reg" data-k="a" mask="url(#mB)"><g mask="url(#mC)"><circle cx="400" cy="310" r="210"/></g></g>
          <g class="reg" data-k="b" mask="url(#mA)"><g mask="url(#mC)"><circle cx="620" cy="310" r="210"/></g></g>
          <g class="reg" data-k="c" mask="url(#mA)"><g mask="url(#mB)"><circle cx="510" cy="500" r="210"/></g></g>
          <g class="reg" data-k="ab" mask="url(#mC)"><g clip-path="url(#cB)"><circle cx="400" cy="310" r="210"/></g></g>
          <g class="reg" data-k="ac" mask="url(#mB)"><g clip-path="url(#cC)"><circle cx="400" cy="310" r="210"/></g></g>
          <g class="reg" data-k="bc" mask="url(#mA)"><g clip-path="url(#cC)"><circle cx="620" cy="310" r="210"/></g></g>
          <g class="reg" data-k="abc" clip-path="url(#cB)"><g clip-path="url(#cC)"><circle cx="400" cy="310" r="210"/></g></g>
          <g class="reg" data-k="d"><circle cx="950" cy="640" r="110"/></g>
        </g>

        <g>
          <circle class="ol" cx="400" cy="310" r="210"/>
          <circle class="ol" cx="620" cy="310" r="210"/>
          <circle class="ol" cx="510" cy="500" r="210"/>
          <circle class="ol dash" cx="950" cy="640" r="110"/>
        </g>

        <g id="tiles"></g>
        <g id="labels"></g>
      </svg>
      <div class="tip" id="tip"></div>

      <div class="index-h">
        <span class="mono">Índice das áreas</span>
        <button class="btn" id="png-btn" type="button">Baixar imagem</button>
      </div>
      <nav class="index" id="index" aria-label="Áreas do diagrama"></nav>
    </section>

    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>

  <footer class="foot">
    <span class="mono" id="foot-title">Categorias do Bolsonarismo</span>
    <button class="btn quiet" id="edit-toggle" type="button">Editar</button>
  </footer>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Imagem ampliada">
  <span class="mono">Fechar (Esc)</span>
  <img alt="">
  <p></p>
</div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="import-file" accept="application/json,.json" class="vh">

<script>
(() => {
  'use strict';

  /* ---------- Geometria ---------- */
  const R = 210, RD = 110;
  const CENTER = { a:[400,310], b:[620,310], c:[510,500], d:[950,640] };
  const VB = { x:30, y:40, w:1060, h:775 };
  const COLORS = {
    paper:'#f1eee6', paper2:'#e7e3d8', field:'#faf8f3', ink:'#1c1b18', ink2:'#5a574e',
    a:'#e2ad45', b:'#d4613f', c:'#5f84ad', d:'#bdb7aa'
  };
  const SERIF = '"Instrument Serif", Georgia, serif';
  const MONO = '"IBM Plex Mono", Menlo, monospace';

  const CODE = { a:'A', b:'B', c:'C', ab:'A ∩ B', ac:'A ∩ C', bc:'B ∩ C', abc:'A ∩ B ∩ C', d:'D' };
  const ORDER = ['a','b','c','ab','ac','bc','abc','d'];

  const DEFAULT_LABELS = {
    title:'Categorias do *Bolsonarismo*',
    a:'Déficit Cognitivo',
    b:'Mau-Caráter',
    c:'Ressentido',
    d:'Indiferença Política'
  };
  const LABEL_KEYS = ['title','a','b','c','d','ab','ac','bc','abc'];

  // Posição e largura máxima dos rótulos dos círculos (unidades do diagrama)
  const LABEL_POS = {
    a: { x:270, y:137, anchor:'end',    max:235 },
    b: { x:750, y:137, anchor:'start',  max:330 },
    c: { x:510, y:770, anchor:'middle', max:560 },
    d: { x:950, y:514, anchor:'middle', max:250 }
  };
  const LABEL_SIZE = 31;

  // Caixa onde as miniaturas aparecem dentro de cada área
  const SLOT = {
    a:   { x:290, y:275, w:130, h:120, s:36 },
    b:   { x:730, y:275, w:130, h:120, s:36 },
    c:   { x:510, y:612, w:170, h:96,  s:36 },
    ab:  { x:510, y:220, w:90,  h:66,  s:26 },
    ac:  { x:385, y:455, w:90,  h:78,  s:26 },
    bc:  { x:635, y:455, w:90,  h:78,  s:26 },
    abc: { x:510, y:375, w:90,  h:66,  s:26 },
    d:   { x:950, y:642, w:150, h:124, s:36 }
  };

  /* ---------- Estado ---------- */
  let state = { updated: 0, labels: {}, items: [] };
  let sel = null;
  let editing = false;
  let labelsOpen = false;

  const $ = (q, el = document) => el.querySelector(q);
  const svg = $('#venn');
  const SVGNS = 'http://www.w3.org/2000/svg';

  /* ---------- Rótulos ---------- */
  function lab(k) {
    const v = ((state.labels || {})[k] || '').trim();
    return v || DEFAULT_LABELS[k];
  }
  function autoName(k) {
    const p = k.split('').map(lab);
    return p.length === 2 ? p[0] + ' e ' + p[1] : p[0] + ', ' + p[1] + ' e ' + p[2];
  }
  function name(k) {
    if (k.length === 1) return lab(k);
    const v = ((state.labels || {})[k] || '').trim();
    return v || autoName(k);
  }
  function parseItalic(str) {
    const out = [];
    let last = 0;
    str.replace(/\*([^*]+)\*/g, (m, g, i) => {
      if (i > last) out.push({ t: str.slice(last, i), i: false });
      out.push({ t: g, i: true });
      last = i + m.length;
      return m;
    });
    if (last < str.length) out.push({ t: str.slice(last), i: false });
    return out;
  }
  const plainTitle = () => parseItalic(lab('title')).map(s => s.t).join('').trim();

  /* ---------- Utilitários ---------- */
  function h(tag, attrs = {}, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, v);
    }
    for (const c of kids.flat()) {
      if (c == null || c === false) continue;
      el.append(c.nodeType ? c : document.createTextNode(String(c)));
    }
    return el;
  }
  function s(tag, attrs = {}) {
    const el = document.createElementNS(SVGNS, tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    return el;
  }
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const plural = n => n === 1 ? '1 item' : n + ' itens';
  const itemsOf = k => state.items.filter(i => i.region === k);
  const slug = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'diagrama';

  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('on'), 2800);
  }

  /* ---------- Armazenamento (IndexedDB) ---------- */
  let dbp;
  function db() {
    if (!dbp) dbp = new Promise((res, rej) => {
      const r = indexedDB.open('venn-categorias-bolsonarismo', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function idbGet(k) {
    const d = await db();
    return new Promise((res, rej) => {
      const q = d.transaction('kv').objectStore('kv').get(k);
      q.onsuccess = () => res(q.result);
      q.onerror = () => rej(q.error);
    });
  }
  async function idbSet(k, v) {
    const d = await db();
    return new Promise((res, rej) => {
      const tx = d.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(v, k);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }
  function save() {
    state.updated = Date.now();
    idbSet('state', state).catch(() => toast('Não foi possível salvar neste navegador.'));
  }

  function sanitize(data) {
    if (!data || !Array.isArray(data.items)) throw new Error('formato');
    const items = data.items
      .filter(i => i && CODE[i.region] && (i.type === 'text' || i.type === 'image') && typeof (i.type === 'text' ? i.text : i.src) === 'string')
      .map(i => i.type === 'text'
        ? { id: i.id || uid(), region: i.region, type: 'text', text: i.text }
        : { id: i.id || uid(), region: i.region, type: 'image', src: i.src, caption: typeof i.caption === 'string' ? i.caption : '' });
    const labels = {};
    if (data.labels && typeof data.labels === 'object') {
      for (const k of LABEL_KEYS) if (typeof data.labels[k] === 'string') labels[k] = data.labels[k].slice(0, 160);
    }
    return { updated: Number(data.updated) || 0, labels, items };
  }

  /* ---------- Imagens ---------- */
  function readDataURL(file) {
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.onerror = () => rej(fr.error);
      fr.readAsDataURL(file);
    });
  }
  function loadImg(src, cors) {
    return new Promise((res, rej) => {
      const im = new Image();
      if (cors && /^https?:/i.test(src)) im.crossOrigin = 'anonymous';
      im.onload = () => res(im);
      im.onerror = rej;
      im.src = src;
    });
  }
  async function prepImage(file) {
    if (file.type === 'image/gif' || file.type === 'image/svg+xml') return readDataURL(file);
    const url = URL.createObjectURL(file);
    try {
      const im = await loadImg(url);
      const max = 1600;
      const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
      const w = Math.round(im.naturalWidth * k), hh = Math.round(im.naturalHeight * k);
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = hh;
      cv.getContext('2d').drawImage(im, 0, 0, w, hh);
      let out = cv.toDataURL('image/webp', 0.85);
      if (!out.startsWith('data:image/webp')) {
        const c2 = document.createElement('canvas');
        c2.width = w; c2.height = hh;
        const x = c2.getContext('2d');
        x.fillStyle = '#ffffff'; x.fillRect(0, 0, w, hh); x.drawImage(cv, 0, 0);
        out = c2.toDataURL('image/jpeg', 0.86);
      }
      return out;
    } finally {
      URL.revokeObjectURL(url);
    }
  }
  async function addFiles(files) {
    const imgs = [...files].filter(f => f.type.startsWith('image/'));
    if (!imgs.length || !sel) return;
    if (imgs.length > 1) toast('Processando ' + imgs.length + ' imagens…');
    const region = sel;
    let ok = 0;
    for (const f of imgs) {
      try {
        const src = await prepImage(f);
        state.items.push({ id: uid(), region, type: 'image', src, caption: '' });
        ok++;
      } catch {
        toast('Não foi possível ler “' + f.name + '”.');
      }
    }
    if (ok) { save(); render(); toast(ok === 1 ? 'Imagem adicionada.' : ok + ' imagens adicionadas.'); }
  }

  /* ---------- Diagrama ---------- */
  function regionAt(x, y) {
    const inside = (k, r) => Math.hypot(x - CENTER[k][0], y - CENTER[k][1]) <= r;
    if (inside('d', RD)) return 'd';
    const k = (inside('a', R) ? 'a' : '') + (inside('b', R) ? 'b' : '') + (inside('c', R) ? 'c' : '');
    return k || null;
  }
  function toSvg(e) {
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }

  let hoverK = null;
  function setHover(k) {
    if (k === hoverK) return;
    hoverK = k;
    svg.querySelectorAll('.reg').forEach(g => g.classList.toggle('hover', g.dataset.k === k && k !== sel));
    svg.style.cursor = k ? 'pointer' : 'default';
  }

  const tip = $('#tip');
  svg.addEventListener('pointermove', e => {
    const p = toSvg(e);
    const k = regionAt(p.x, p.y);
    setHover(k);
    if (k && e.pointerType === 'mouse') {
      const r = $('#stage').getBoundingClientRect();
      tip.textContent = CODE[k] + ' — ' + name(k) + ' · ' + plural(itemsOf(k).length);
      tip.style.left = (e.clientX - r.left) + 'px';
      tip.style.top = (e.clientY - r.top) + 'px';
      tip.classList.add('on');
    } else tip.classList.remove('on');
  });
  svg.addEventListener('pointerleave', () => { setHover(null); tip.classList.remove('on'); });
  svg.addEventListener('click', e => {
    const p = toSvg(e);
    const k = regionAt(p.x, p.y);
    select(k && k === sel ? null : k);
  });

  // Calcula a posição das miniaturas de uma área (usado na tela e na imagem exportada)
  function tileLayout(k) {
    const list = itemsOf(k);
    if (!list.length) return [];
    const { x, y, w, h: hh, s: sz } = SLOT[k];
    const gap = 4;
    const maxCols = Math.max(1, Math.floor((w + gap) / (sz + gap)));
    const maxRows = Math.max(1, Math.floor((hh + gap) / (sz + gap)));
    const cap = maxCols * maxRows;
    const shown = list.length <= cap ? list : list.slice(0, cap - 1);
    const more = list.length - shown.length;
    const n = shown.length + (more ? 1 : 0);
    const cols = Math.min(n, maxCols);
    const rows = Math.ceil(n / cols);
    const y0 = y - (rows * sz + (rows - 1) * gap) / 2;
    const cells = [];
    for (let i = 0; i < n; i++) {
      const r = Math.floor(i / cols), c = i % cols;
      const inRow = r < rows - 1 ? cols : n - cols * (rows - 1);
      cells.push({
        x: x - (inRow * sz + (inRow - 1) * gap) / 2 + c * (sz + gap),
        y: y0 + r * (sz + gap),
        s: sz,
        kind: i === shown.length ? 'more' : shown[i].type,
        item: shown[i],
        more
      });
    }
    return cells;
  }

  function renderTiles() {
    const g = $('#tiles');
    g.replaceChildren();
    for (const k of ORDER) {
      for (const c of tileLayout(k)) {
        const t = s('g');
        if (c.kind === 'more') {
          t.append(s('rect', { class:'tile-more', x:c.x, y:c.y, width:c.s, height:c.s }));
          const tn = s('text', { class:'tile-n', x:c.x + c.s / 2, y:c.y + c.s / 2 + 4, 'text-anchor':'middle' });
          tn.textContent = '+' + c.more;
          t.append(tn);
        } else if (c.kind === 'image') {
          t.append(s('rect', { class:'tile-bg', x:c.x, y:c.y, width:c.s, height:c.s }));
          const im = s('image', { x:c.x, y:c.y, width:c.s, height:c.s, preserveAspectRatio:'xMidYMid slice' });
          im.setAttribute('href', c.item.src);
          t.append(im, s('rect', { class:'tile-rect', x:c.x, y:c.y, width:c.s, height:c.s }));
        } else {
          t.append(s('rect', { class:'tile-bg', x:c.x, y:c.y, width:c.s, height:c.s }));
          const q = s('text', { class:'tile-q', x:c.x + c.s / 2, y:c.y + c.s * 0.86, 'text-anchor':'middle', 'font-size':c.s * 1.15 });
          q.textContent = '“';
          t.append(q);
        }
        g.append(t);
      }
    }
    svg.querySelectorAll('.reg').forEach(r => {
      r.classList.toggle('sel', r.dataset.k === sel);
      r.classList.toggle('hover', r.dataset.k === hoverK && hoverK !== sel);
    });
  }

  // Rótulo longo: quebra em duas linhas e só reduz a fonte se ainda não couber
  const mctx = document.createElement('canvas').getContext('2d');
  function textW(t, size) {
    mctx.font = '400 ' + size + 'px ' + SERIF;
    return mctx.measureText(t).width;
  }
  function computeLabel(k) {
    const p = LABEL_POS[k];
    const text = lab(k);
    let size = LABEL_SIZE, lines = [text];
    if (textW(text, size) > p.max) {
      const words = text.split(/\s+/);
      if (words.length > 1) {
        let best = null;
        for (let i = 1; i < words.length; i++) {
          const l = [words.slice(0, i).join(' '), words.slice(i).join(' ')];
          const wmax = Math.max(textW(l[0], size), textW(l[1], size));
          if (!best || wmax < best.w) best = { l, w: wmax };
        }
        lines = best.l;
        if (best.w > p.max) size = Math.max(16, size * p.max / best.w);
      } else {
        size = Math.max(14, size * p.max / textW(text, size));
      }
    }
    const lh = size * 1.04;
    const up = k !== 'c';
    const ys = lines.map((_, i) => up ? p.y - (lines.length - 1 - i) * lh : p.y + i * lh);
    return { p, size, lines, ys, codeY: (up ? ys[0] : p.y) - size - 2 };
  }

  function renderSvgLabels() {
    const g = $('#labels');

    for (const k of ['a','b','c','d']) {

  /* ---------- Exportar como imagem (PNG) ---------- */
  function setFont(ctx, f, spacing) {
    ctx.font = f;
    if ('letterSpacing' in ctx) ctx.letterSpacing = spacing || '0px';
  }

  async function exportPNG() {
    const btn = $('#png-btn');
    btn.disabled = true;
    toast('Gerando imagem…');
    try {
      try {
        await Promise.all([
          '400 32px "Instrument Serif"', 'italic 400 32px "Instrument Serif"',
          '400 13px "IBM Plex Mono"'
        ].map(f => document.fonts.load(f)));
      } catch {}

      // carrega as imagens usadas nas miniaturas
      const cells = ORDER.flatMap(k => tileLayout(k));
      const imgs = new Map();
      await Promise.all(cells.filter(c => c.kind === 'image').map(async c => {
        if (imgs.has(c.item.src)) return;
        try { imgs.set(c.item.src, await loadImg(c.item.src, true)); }
        catch { imgs.set(c.item.src, null); }
      }));

      const PAD = 60, SC = 2;
      const W = VB.w + PAD * 2;
      const tc = document.createElement('canvas').getContext('2d');

      // título: reduz a fonte se não couber na largura
      const segs = parseItalic(lab('title'));
      let tSize = 64;
      const measure = size => segs.reduce((sum, sg) => {
        setFont(tc, (sg.i ? 'italic ' : '') + '400 ' + size + 'px ' + SERIF, '-0.6px');
        return sum + tc.measureText(sg.t).width;
      }, 0);
      const tw = measure(tSize);
      if (tw > VB.w) tSize = Math.max(24, tSize * VB.w / tw);

      const titleBase = PAD + tSize * 0.78;
      const metaBase = titleBase + 34;
      const ruleY = metaBase + 20;
      const diagTop = ruleY + 16;
      const H = Math.ceil(diagTop + VB.h + PAD * 0.6);

      const cv = document.createElement('canvas');
      cv.width = W * SC; cv.height = H * SC;
      const ctx = cv.getContext('2d');
      ctx.scale(SC, SC);

      ctx.fillStyle = COLORS.paper;
      ctx.fillRect(0, 0, W, H);

      // título
      let x = PAD;
      ctx.fillStyle = COLORS.ink;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      for (const sg of segs) {
        setFont(ctx, (sg.i ? 'italic ' : '') + '400 ' + tSize + 'px ' + SERIF, '-0.6px');
        ctx.fillText(sg.t, x, titleBase);
        x += ctx.measureText(sg.t).width;
      }

      // linha de informações e régua
      setFont(ctx, '400 12px ' + MONO, '0.8px');
      ctx.fillStyle = COLORS.ink2;
      const date = new Date(state.updated || Date.now()).toLocaleDateString('pt-BR');
      ctx.fillText(('Diagrama de Venn  ·  ' + date).toUpperCase(), PAD, metaBase);
      ctx.fillStyle = COLORS.ink;
      ctx.fillRect(PAD, ruleY, W - PAD * 2, 1);

      // diagrama
      ctx.save();
      ctx.translate(PAD - VB.x, diagTop - VB.y);

      const circle = (k, r) => { ctx.beginPath(); ctx.arc(CENTER[k][0], CENTER[k][1], r, 0, Math.PI * 2); };
      ctx.globalCompositeOperation = 'multiply';
      ctx.globalAlpha = 0.62;
      for (const k of ['a','b','c']) { circle(k, R); ctx.fillStyle = COLORS[k]; ctx.fill(); }
      ctx.globalAlpha = 0.45;
      circle('d', RD); ctx.fillStyle = COLORS.d; ctx.fill();
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';

      ctx.strokeStyle = COLORS.ink;
      ctx.lineWidth = 1.3;
      for (const k of ['a','b','c']) { circle(k, R); ctx.stroke(); }
      ctx.save();
      ctx.lineWidth = 1.5; ctx.setLineDash([3, 6]); ctx.lineCap = 'round';
      circle('d', RD); ctx.stroke();
      ctx.restore();

      // miniaturas
      ctx.lineWidth = 1;
      for (const c of cells) {
        if (c.kind === 'more') {
          ctx.fillStyle = COLORS.ink;
          ctx.fillRect(c.x, c.y, c.s, c.s);
          setFont(ctx, '400 11px ' + MONO);
          ctx.fillStyle = COLORS.paper;
          ctx.textAlign = 'center';
          ctx.fillText('+' + c.more, c.x + c.s / 2, c.y + c.s / 2 + 4);
          continue;
        }
        ctx.fillStyle = COLORS.field;
        ctx.fillRect(c.x, c.y, c.s, c.s);
        if (c.kind === 'image') {
          const im = imgs.get(c.item.src);
          if (im) {
            const iw = im.naturalWidth, ih = im.naturalHeight;
            const k = Math.max(c.s / iw, c.s / ih);
            const sw = c.s / k, sh = c.s / k;
            ctx.drawImage(im, (iw - sw) / 2, (ih - sh) / 2, sw, sh, c.x, c.y, c.s, c.s);
          } else {
            ctx.fillStyle = COLORS.paper2;
            ctx.fillRect(c.x, c.y, c.s, c.s);
          }
        } else {
          setFont(ctx, '400 ' + (c.s * 1.15) + 'px ' + SERIF);
          ctx.fillStyle = COLORS.ink;
          ctx.textAlign = 'center';
          ctx.fillText('“', c.x + c.s / 2, c.y + c.s * 0.86);
        }
        ctx.strokeStyle = COLORS.ink;
        ctx.strokeRect(c.x + 0.5, c.y + 0.5, c.s - 1, c.s - 1);
      }

      // rótulos dos círculos
      const align = { start:'left', end:'right', middle:'center' };
      for (const k of ['a','b','c','d']) {
        const L = computeLabel(k);
        ctx.textAlign = align[L.p.anchor];
        setFont(ctx, '400 13px ' + MONO, '1.3px');
        ctx.fillStyle = COLORS.ink2;
        ctx.fillText(CODE[k], L.p.x, L.codeY);
        setFont(ctx, '400 ' + L.size + 'px ' + SERIF);
        ctx.fillStyle = COLORS.ink;
        L.lines.forEach((ln, i) => ctx.fillText(ln, L.p.x, L.ys[i]));
      }
      ctx.restore();

      const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
      if (!blob) throw new Error('blob');
      const a = h('a', { href: URL.createObjectURL(blob), download: slug(plainTitle()) + '.png' });
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      const missing = [...imgs.values()].filter(v => !v).length;
      toast(missing
        ? 'Imagem gerada. ' + missing + ' foto(s) de link externo não puderam ser incluídas.'
        : 'Imagem gerada.');
    } catch (err) {
      toast('Não foi possível gerar a imagem.');
    } finally {
      btn.disabled = false;
    }
  }
  $('#png-btn').addEventListener('click', exportPNG);

  /* ---------- Exportar / importar dados ---------- */
  function exportData() {
    const blob = new Blob([JSON.stringify({ updated: state.updated || Date.now(), labels: state.labels || {}, items: state.items })], { type:'application/json' });
    const a = h('a', { href: URL.createObjectURL(blob), download: 'dados.json' });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Arquivo dados.json gerado.');
  }
  $('#import-file').addEventListener('change', async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try {
      const data = sanitize(JSON.parse(await f.text()));
      if (state.items.length && !confirm('Substituir o conteúdo atual pelo do arquivo importado?')) return;
      state = data; save(); render();
      toast(plural(state.items.length) + ' importados.');
    } catch {
      toast('Arquivo inválido.');
    }
  });
  function clearAll() {
    if (!state.items.length) return;
    if (!confirm('Apagar todos os textos e fotos do diagrama? Os rótulos serão mantidos. Esta ação não pode ser desfeita.')) return;
    state.items = []; save(); render(); toast('Conteúdo apagado.');
  }

  /* ---------- Visualizador ---------- */
  const lb = $('#lb');
  function openLb(it) {
    $('img', lb).src = it.src;
    $('img', lb).alt = it.caption || '';
    $('p', lb).textContent = it.caption || '';
    lb.classList.add('on');
  }
  lb.addEventListener('click', () => lb.classList.remove('on'));
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (lb.classList.contains('on')) lb.classList.remove('on');
      else if (sel && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) select(null);
    }
  });

  document.addEventListener('paste', e => {
    if (!editing || !sel || !e.clipboardData) return;
    const files = [...e.clipboardData.files].filter(f => f.type.startsWith('image/'));
    if (!files.length) return;
    e.preventDefault();
    addFiles(files);
  });

  $('#edit-toggle').addEventListener('click', () => setEditing(!editing));

  /* ---------- Início ---------- */
  (async function init() {
    let local = null, remote = null;
    try { local = await idbGet('state'); } catch {}
    try {
      const r = await fetch('dados.json', { cache:'no-store' });
      if (r.ok) remote = sanitize(await r.json());
    } catch {}
    if (remote && (!local || (remote.updated || 0) > (local.updated || 0))) state = remote;
    else if (local) { try { state = sanitize(local); } catch {} }
    editing = !remote;
    render();
    // reajusta os rótulos quando as fontes terminarem de carregar
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderSvgLabels);
  })();
})();
</script>
